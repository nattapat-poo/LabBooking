<!--
 * FILE: Modal_BatchAction.html
 * PURPOSE: TALT Staging Area modal for high-volume bulk and individual request approvals or denials.
 * DESIGN SPEC REF: Section 3.2
 * VERSION: 1.1.3c
 * LAST MODIFIED: July 24, 2026
 * PROTOCOL: 1:1 Mirror Promotion (PRD 17.2)
 * AUTHOR: Gemini (Engineering Mode)
-->
<div id="modal-batch-action" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
  <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fade-in">
    
    <!-- Header -->
    <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
      <div>
        <h3 class="text-lg font-bold text-slate-800">Batch Workspace Review</h3>
        <p class="text-xs text-slate-500">Perform individual or bulk actions on active booking requests</p>
      </div>
      <button onclick="closeBatchActionModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Master Controls -->
    <div class="px-6 py-3 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between gap-4">
      <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Set Global Intent:</span>
      <div class="inline-flex rounded-lg bg-slate-200 p-1 gap-1">
        <button onclick="applyGlobalBatchIntent('approve')" class="px-3 py-1 text-xs font-medium rounded-md bg-white text-emerald-700 shadow-sm hover:bg-emerald-50 transition-colors">Approve All</button>
        <button onclick="applyGlobalBatchIntent('decline')" class="px-3 py-1 text-xs font-medium rounded-md bg-white text-red-700 shadow-sm hover:bg-red-50 transition-colors">Decline All</button>
        <button onclick="applyGlobalBatchIntent('skip')" class="px-3 py-1 text-xs font-medium rounded-md text-slate-600 hover:bg-slate-300 transition-colors">Reset</button>
      </div>
    </div>

    <!-- Table Content -->
    <div class="p-6 overflow-y-auto flex-1">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <th class="py-2 px-3">Slot Info</th>
            <th class="py-2 px-3">Teacher</th>
            <th class="py-2 px-3">Subject</th>
            <th class="py-2 px-3">Lab</th>
            <th class="py-2 px-3 text-right">Action Decision</th>
          </tr>
        </thead>
        <tbody id="batch-action-table-body" class="divide-y divide-slate-100 text-sm">
          <!-- Dynamically populated rows -->
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
      <span id="batch-action-tally" class="text-xs font-medium text-slate-600">0 Items Selected</span>
      <div class="flex items-center gap-3">
        <button onclick="closeBatchActionModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
        <button id="btn-commit-batch-action" onclick="commitBatchActions()" class="px-5 py-2 text-sm font-bold text-white bg-muids-blue hover:bg-blue-800 rounded-lg shadow-md active:scale-95 transition-all">Commit Actions</button>
      </div>
    </div>

  </div>
</div>

<script>
let activeBatchItems = [];

function openBatchActionModal(requests) {
  activeBatchItems = requests.map(r => ({ ...r, decision: 'skip' }));
  renderBatchActionTable();
  const modal = document.getElementById('modal-batch-action');
  if (modal) modal.classList.remove('hidden');
}

function closeBatchActionModal() {
  const modal = document.getElementById('modal-batch-action');
  if (modal) modal.classList.add('hidden');
}

function renderBatchActionTable() {
  const tbody = document.getElementById('batch-action-table-body');
  if (!tbody) return;

  tbody.innerHTML = activeBatchItems.map((item, idx) => `
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="py-3 px-3 font-mono text-xs text-slate-700">${item.date} P${item.period}</td>
      <td class="py-3 px-3 font-medium text-slate-800">${item.teacherName}</td>
      <td class="py-3 px-3 text-slate-600">${item.subject}</td>
      <td class="py-3 px-3 text-slate-600">${item.labName}</td>
      <td class="py-3 px-3 text-right">
        <div class="inline-flex rounded-md shadow-sm">
          <button onclick="setItemDecision(${idx}, 'approve')" class="px-2.5 py-1 text-xs font-medium rounded-l-md border ${item.decision === 'approve' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}">Approve</button>
          <button onclick="setItemDecision(${idx}, 'decline')" class="px-2.5 py-1 text-xs font-medium rounded-r-md border-t border-b border-r ${item.decision === 'decline' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}">Decline</button>
        </div>
      </td>
    </tr>
  `).join('');

  updateBatchTally();
}

function setItemDecision(index, decision) {
  if (activeBatchItems[index]) {
    activeBatchItems[index].decision = activeBatchItems[index].decision === decision ? 'skip' : decision;
    renderBatchActionTable();
  }
}

function applyGlobalBatchIntent(intent) {
  activeBatchItems.forEach(item => item.decision = intent);
  renderBatchActionTable();
}

function updateBatchTally() {
  const approves = activeBatchItems.filter(i => i.decision === 'approve').length;
  const declines = activeBatchItems.filter(i => i.decision === 'decline').length;
  const tallyElem = document.getElementById('batch-action-tally');
  if (tallyElem) {
    tallyElem.textContent = `Selected: ${approves} Approvals, ${declines} Denials`;
  }
}

function commitBatchActions() {
  const decisions = activeBatchItems.filter(i => i.decision !== 'skip');
  if (decisions.length === 0) {
    showToast('No actions designated to commit.', 'warning');
    return;
  }

  showToast('Processing batch decisions...', 'info');
  google.script.run
    .withSuccessHandler(() => {
      showToast('Batch decisions committed successfully.', 'success');
      closeBatchActionModal();
      if (typeof window.refreshTimeline === 'function') window.refreshTimeline();
    })
    .withFailureHandler((err) => {
      showToast('Commit failed: ' + (err.message || err), 'error');
    })
    .rbacExecuteApprove({ items: decisions });
}
</script>
