<div id="fallback-error-shell" class="min-h-screen w-screen bg-slate-50 flex items-center justify-center p-4 md:p-6 font-sans">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 md:p-8 border border-slate-200 text-center relative overflow-hidden">
    
    <!-- Top Decorative Status Bar -->
    <div class="absolute top-0 left-0 right-0 h-2 bg-red-500"></div>

    <!-- Exception Shield Icon -->
    <div class="mx-auto mb-5 w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center ring-8 ring-red-50/50">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>

    <!-- Error Summary Header -->
    <h1 class="text-2xl font-bold text-slate-900 mb-2 tracking-tight">System Exception Encountered</h1>
    <p class="text-sm text-slate-600 mb-6">
      The MUIDS Lab Booking application encountered an unrecoverable operational state. Your request could not be processed automatically.
    </p>

    <!-- Technical Diagnostic Details Container -->
    <div class="mb-6 text-left bg-slate-900 text-slate-200 rounded-xl p-4 text-xs font-mono border border-slate-800 shadow-inner overflow-x-auto max-h-48 scrollbar-thin">
      <div class="text-slate-400 uppercase text-[10px] tracking-wider mb-1 font-semibold border-b border-slate-800 pb-1 flex justify-between items-center">
        <span>Diagnostic Log String</span>
        <span id="fallback-timestamp" class="text-slate-500">
          <?= new Date().toISOString() ?>
        </span>
      </div>
      <p id="fallback-error-message" class="text-red-400 font-medium break-words pt-1">
        <?= typeof errorMessage !== 'undefined' ? errorMessage : 'Fatal runtime error: Unhandled execution barrier failure.' ?>
      </p>
    </div>

    <!-- Primary Action Guidance -->
    <div class="space-y-3">
      <button 
        type="button" 
        id="btn-fallback-reload"
        onclick="window.location.reload(true);"
        class="w-full h-11 bg-[#003366] hover:bg-blue-900 active:scale-[0.98] text-white rounded-xl font-medium transition-all duration-200 shadow-md flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#003366]/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Reload Application Interface</span>
      </button>

      <a 
        href="mailto:talt.muids@mahidol.ac.th?subject=System%20Exception%20Report%20-%20MUIDS%20Lab%20Booking"
        class="block w-full py-2.5 text-xs text-slate-500 hover:text-slate-800 font-medium rounded-lg transition-colors border border-transparent hover:border-slate-200">
        Contact Lab Technician (TALT) Support
      </a>
    </div>

  </div>
</div>

<script>
  /**
   * Diagnostic Telemetry Hook for Fallback Shell
   */
  document.addEventListener('DOMContentLoaded', function() {
    console.error('[UI_FallbackError] Critical error template rendered into active DOM.');
    var timestampEl = document.getElementById('fallback-timestamp');
    if (timestampEl && !timestampEl.textContent.trim()) {
      timestampEl.textContent = new Date().toISOString();
    }
  });
</script>
