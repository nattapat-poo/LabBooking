<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUIDS System Diagnostic Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons for Dual-Coding Accessibility[cite: 11] -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Tailwind Configuration[cite: 11] -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'muids-blue': '#003366',
                        'muids-blue-light': '#E6EBF0',
                        'status-pending': '#F59E0B', 
                        'status-booked': '#10B981', 
                        'status-denied': '#EF4444', 
                    }
                }
            }
        }
    </script>
    <style>
        /* Scrollbar-hide utility for mobile smart logic[cite: 11] */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center">

    <!-- Main Container Card[cite: 11] -->
    <main class="w-full max-w-5xl bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden flex flex-col h-[90vh]">
        
        <!-- Header Section -->
        <header class="bg-muids-blue text-white p-5 flex flex-col md:flex-row items-center justify-between z-40 border-b border-muids-blue-light">
            <div class="flex items-center gap-3 w-full md:w-auto mb-4 md:mb-0">
                <i data-lucide="activity" class="w-6 h-6 text-white"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">System Diagnostic Console</h1>
                    <p class="text-xs text-blue-200 font-mono tracking-wide">MUIDS Lab Booking App v1.1.3c | UAT & Health Bridge</p>
                </div>
            </div>

            <!-- Action Controls[cite: 11] -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <button id="btn-clear" onclick="diagnosticApp.clearAllTelemetryOutputs()" class="flex items-center gap-2 h-10 px-4 text-sm font-medium border-2 border-white text-white hover:bg-white hover:text-muids-blue rounded-md transition-all duration-200 active:scale-95">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    Clear Console
                </button>
                <button id="btn-run-all" onclick="diagnosticApp.runAllTests()" class="flex items-center gap-2 h-10 px-4 text-sm font-medium bg-status-booked text-white hover:brightness-110 shadow-md rounded-md transition-all duration-200 active:scale-95">
                    <i data-lucide="play-circle" class="w-4 h-4"></i>
                    Run Diagnostics
                </button>
            </div>
        </header>

        <!-- Stats Overview Bar -->
        <div class="bg-slate-100 border-b border-gray-200 p-3 flex justify-around text-sm font-semibold shadow-inner">
            <div class="flex items-center gap-2 text-slate-600"><span id="stat-total" class="px-2 py-1 bg-white rounded border border-gray-300">0</span> Total</div>
            <div class="flex items-center gap-2 text-status-booked"><span id="stat-passed" class="px-2 py-1 bg-emerald-100 rounded border border-emerald-300">0</span> Passed</div>
            <div class="flex items-center gap-2 text-status-denied"><span id="stat-failed" class="px-2 py-1 bg-red-100 rounded border border-red-300">0</span> Failed</div>
            <div class="flex items-center gap-2 text-status-pending"><span id="stat-running" class="px-2 py-1 bg-amber-100 rounded border border-amber-300">0</span> Pending</div>
        </div>

        <!-- Advanced UI Console Output (Scrollable List)[cite: 11] -->
        <div class="flex-1 overflow-y-auto p-4 bg-slate-50 scrollbar-hide" id="console-stream-container">
            <ul id="console-stream" class="space-y-3">
                <!-- Dynamic Log Entries Inject Here -->
                <li id="initial-state-msg" class="text-center text-slate-400 font-mono text-sm py-10 flex flex-col items-center gap-2">
                    <i data-lucide="terminal" class="w-8 h-8 opacity-50"></i>
                    System standing by. Click "Run Diagnostics" to execute UAT Bridge Suites.
                </li>
            </ul>
        </div>

        <!-- Footer / Clipboard Action -->
        <footer class="bg-white border-t border-gray-200 p-4 flex justify-between items-center">
            <div class="text-xs text-slate-500 font-mono flex items-center gap-2">
                <span id="ui-mutex-state" class="inline-block w-2 h-2 rounded-full bg-slate-300"></span>
                Mutex State: <span id="mutex-label">UNLOCKED</span>
            </div>
            <button id="btn-copy" onclick="diagnosticApp.copyActiveConsoleToClipboard()" class="flex items-center gap-2 text-sm text-gray-500 hover:text-muids-blue transition-colors">
                <i data-lucide="copy" class="w-4 h-4"></i>
                Copy Telemetry Log
            </button>
        </footer>
    </main>

    <!-- Toast Container (Fixed Top Right)[cite: 11] -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 w-full max-w-xs pointer-events-none"></div>

    <script>
        /**
         * Diagnostic Console Client-Side Logic
         * Implements robust state management, UI mutation, and defensive execution constraints.
         */
        const diagnosticApp = (() => {
            // State Vectors
            let isRunning = false;
            let stats = { total: 0, passed: 0, failed: 0, running: 0 };
            
            // DOM Elements
            const stream = document.getElementById('console-stream');
            const initialMsg = document.getElementById('initial-state-msg');
            const uiMutex = document.getElementById('ui-mutex-state');
            const mutexLabel = document.getElementById('mutex-label');
            const runBtn = document.getElementById('btn-run-all');

            /**
             * Updates the numerical statistical counters on the UI
             */
            const _updateStatsUI = () => {
                document.getElementById('stat-total').innerText = stats.total;
                document.getElementById('stat-passed').innerText = stats.passed;
                document.getElementById('stat-failed').innerText = stats.failed;
                document.getElementById('stat-running').innerText = stats.running;
            };

            /**
             * Triggers an ephemeral Toast Notification[cite: 11]
             */
            const _showToast = (message, type) => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                // Color formatting based on dual-coding matrix[cite: 11]
                let colorClasses = type === 'error' ? 'bg-red-50 text-red-800 border-l-4 border-status-denied' : 
                                   type === 'success' ? 'bg-emerald-50 text-emerald-800 border-l-4 border-status-booked' : 
                                   'bg-amber-50 text-amber-800 border-l-4 border-status-pending';
                
                let icon = type === 'error' ? 'alert-octagon' : type === 'success' ? 'check-circle' : 'info';

                toast.className = `pointer-events-auto flex items-center p-4 rounded-lg shadow-xl transition-all duration-500 transform ease-in-out animate-slide-in-right ${colorClasses}`;
                toast.innerHTML = `
                    <i data-lucide="${icon}" class="w-5 h-5 mr-3 flex-shrink-0"></i>
                    <span class="text-sm font-medium flex-1">${message}</span>
                    <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-900 ml-2 focus:outline-none">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                `;
                container.appendChild(toast);
                lucide.createIcons();

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => toast.remove(), 500);
                }, 5000);
            };

            /**
             * Sets the UI Mutex lock state to prevent concurrent executions
             */
            const setUIMutexState = (locked) => {
                isRunning = locked;
                if (locked) {
                    uiMutex.classList.replace('bg-slate-300', 'bg-status-pending');
                    uiMutex.classList.replace('bg-status-booked', 'bg-status-pending');
                    uiMutex.classList.add('animate-pulse');
                    mutexLabel.innerText = "LOCKED (EXECUTING)";
                    runBtn.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    runBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Processing...`;
                } else {
                    uiMutex.classList.replace('bg-status-pending', 'bg-status-booked');
                    uiMutex.classList.remove('animate-pulse');
                    mutexLabel.innerText = "UNLOCKED";
                    runBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    runBtn.innerHTML = `<i data-lucide="play-circle" class="w-4 h-4"></i> Run Diagnostics`;
                }
                lucide.createIcons();
            };

            /**
             * Appends a highly stylized diagnostic result block into the stream
             */
            const writeToConsoleStream = (testId, name, status, durationMs, message) => {
                if (initialMsg) initialMsg.style.display = 'none';

                const li = document.createElement('li');
                li.id = `test-row-${testId}`;
                
                const isPassed = status === 'PASSED';
                const isRunningStatus = status === 'RUNNING';
                const isFailed = status === 'FAILED';

                // Determine border and text styling based on PRD status colors[cite: 11]
                const borderClass = isPassed ? 'border-status-booked' : 
                                    isFailed ? 'border-status-denied' : 'border-status-pending';
                
                const bgClass = isPassed ? 'bg-white' : 
                                isFailed ? 'bg-red-50' : 'bg-slate-50 animate-pulse';
                                
                const icon = isPassed ? `<i data-lucide="check-circle" class="w-5 h-5 text-status-booked"></i>` :
                             isFailed ? `<i data-lucide="x-circle" class="w-5 h-5 text-status-denied"></i>` :
                             `<i data-lucide="loader" class="w-5 h-5 text-status-pending animate-spin"></i>`;

                li.className = `flex flex-col md:flex-row md:items-center justify-between p-4 rounded-xl border-l-4 ${borderClass} ${bgClass} shadow-sm`;
                li.innerHTML = `
                    <div class="flex items-start md:items-center gap-4">
                        <div class="flex-shrink-0 mt-1 md:mt-0">${icon}</div>
                        <div>
                            <div class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                ${name} 
                                <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full ${isPassed ? 'bg-emerald-100 text-emerald-800' : isFailed ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}">${status}</span>
                            </div>
                            <div class="text-xs text-slate-500 mt-1 font-mono break-words">${message}</div>
                        </div>
                    </div>
                    <div class="mt-3 md:mt-0 md:ml-4 text-xs font-mono text-slate-400 whitespace-nowrap">
                        ${durationMs !== null ? `~${durationMs}ms` : '--'}
                    </div>
                `;
                
                stream.appendChild(li);
                stream.parentElement.scrollTop = stream.parentElement.scrollHeight;
                lucide.createIcons();
            };

            /**
             * Mutates the visual state of an existing DOM test row
             */
            const updateRowState = (testId, status, durationMs, message) => {
                const li = document.getElementById(`test-row-${testId}`);
                if (!li) return;

                stats.running = Math.max(0, stats.running - 1);
                if (status === 'PASSED') stats.passed++;
                if (status === 'FAILED') stats.failed++;
                _updateStatsUI();

                const isPassed = status === 'PASSED';
                
                const borderClass = isPassed ? 'border-status-booked' : 'border-status-denied';
                const bgClass = isPassed ? 'bg-white' : 'bg-red-50';
                const icon = isPassed ? `<i data-lucide="check-circle" class="w-5 h-5 text-status-booked"></i>` : `<i data-lucide="x-circle" class="w-5 h-5 text-status-denied"></i>`;

                li.className = `flex flex-col md:flex-row md:items-center justify-between p-4 rounded-xl border-l-4 ${borderClass} ${bgClass} shadow-sm transition-colors duration-300`;
                li.innerHTML = `
                    <div class="flex items-start md:items-center gap-4">
                        <div class="flex-shrink-0 mt-1 md:mt-0">${icon}</div>
                        <div>
                            <div class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                ${li.getAttribute('data-test-name') || `Diagnostic Task [${testId}]`}
                                <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full ${isPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${status}</span>
                            </div>
                            <div class="text-xs ${isPassed ? 'text-slate-500' : 'text-red-600 font-semibold'} mt-1 font-mono break-words">${message}</div>
                        </div>
                    </div>
                    <div class="mt-3 md:mt-0 md:ml-4 text-xs font-mono text-slate-400 whitespace-nowrap">
                        ~${durationMs}ms
                    </div>
                `;
                lucide.createIcons();
            };

            return {
                initializeDiagnosticConsole: () => {
                    lucide.createIcons();
                    _showToast('Diagnostic Engine Ready', 'success');
                },

                runSingleTest: async (testConfig) => {
                    // Pre-flight setup
                    stats.total++;
                    stats.running++;
                    _updateStatsUI();
                    
                    const testId = `T-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
                    writeToConsoleStream(testId, testConfig.name, 'RUNNING', null, 'Executing target namespace payload...');
                    
                    // Attach original name to element for updating later
                    document.getElementById(`test-row-${testId}`).setAttribute('data-test-name', testConfig.name);

                    try {
                        const startTime = performance.now();
                        
                        // Mock asynchronous delay acting as Server-Side execution (google.script.run emulation)
                        await new Promise(resolve => setTimeout(resolve, testConfig.mockDelay || 800));
                        
                        const endTime = performance.now();
                        const duration = Math.round(endTime - startTime);

                        if(testConfig.forceFail) {
                            throw new Error("Strict Compliance Exception: Object boundary violation detected.");
                        }

                        updateRowState(testId, 'PASSED', duration, 'Test logic fulfilled successfully.');
                    } catch (error) {
                        updateRowState(testId, 'FAILED', testConfig.mockDelay || 800, error.message);
                    }
                },

                runAllTests: async () => {
                    if (isRunning) return _showToast('A diagnostic suite is already running.', 'warning');
                    
                    setUIMutexState(true);
                    _showToast('Commencing batch test execution...', 'info');

                    // Batch payload mock array conforming to modular testing structures[cite: 9]
                    const testQueue = [
                        { name: 'Health_Unit_Bridge: Authentication Gateway', mockDelay: 450, forceFail: false },
                        { name: 'Health_Unit_Core: Config Hydration', mockDelay: 600, forceFail: false },
                        { name: 'Health_Unit_Service: Submit Batch Transaction', mockDelay: 1100, forceFail: false },
                        { name: 'Health_UAT: Concurrent Mutex Lock Screen', mockDelay: 1500, forceFail: true }, // Purposeful failure for UI demo
                        { name: 'Health_Unit_Core: Schema Mapping Deep Freeze', mockDelay: 350, forceFail: false }
                    ];

                    for (const test of testQueue) {
                        await diagnosticApp.runSingleTest(test);
                    }

                    setUIMutexState(false);
                    _showToast('Diagnostic suite execution completed.', 'success');
                },

                clearAllTelemetryOutputs: () => {
                    if (isRunning) return _showToast('Cannot clear console while locked.', 'error');
                    stream.innerHTML = '';
                    if (initialMsg) stream.appendChild(initialMsg);
                    initialMsg.style.display = 'flex';
                    stats = { total: 0, passed: 0, failed: 0, running: 0 };
                    _updateStatsUI();
                    _showToast('Telemetry stream purged.', 'success');
                },

                copyActiveConsoleToClipboard: () => {
                    const textLines = Array.from(stream.querySelectorAll('li')).map(li => li.innerText.replace(/\n/g, ' - '));
                    const payload = textLines.join('\n');
                    navigator.clipboard.writeText(payload).then(() => {
                        _showToast('Telemetry copied to clipboard.', 'success');
                    }).catch(err => {
                        _showToast('Clipboard access denied.', 'error');
                    });
                }
            };
        })();

        // Boot system upon DOM load
        document.addEventListener('DOMContentLoaded', diagnosticApp.initializeDiagnosticConsole);
    </script>
</body>
</html>
