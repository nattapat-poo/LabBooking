<div id="talt-dashboard-container" class="w-full flex flex-col gap-4 animate-fade-in hidden">
  
  <!-- TALT Dashboard Header & Controls -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 gap-4">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-muids-blue/10 rounded-lg">
        <i data-lucide="shield-check" class="w-6 h-6 text-muids-blue"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-gray-800">Master Dashboard</h2>
        <p class="text-xs text-gray-500">Global oversight and batch processing</p>
      </div>
    </div>

    <!-- Maintenance Mode Toggle -->
    <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-200">
      <span class="text-sm font-medium text-slate-700">Maintenance Mode</span>
      <button id="toggle-maintenance-btn" onclick="taltView.toggleMaintenanceMode()" class="w-12 h-6 rounded-full bg-slate-300 relative transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-muids-blue/20">
        <span id="maintenance-toggle-knob" class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white transition-transform duration-300"></span>
      </button>
    </div>
  </div>

  <!-- Master Grid Container (Mobile-Smart Horizontal Overflow)[cite: 6] -->
  <div class="w-full bg-white rounded-xl shadow-2xl border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto scrollbar-hide snap-x" style="-webkit-overflow-scrolling: touch;">
      <!-- Grid Layout: sticky left column, 8 period columns[cite: 6] -->
      <div id="talt-master-grid" class="grid grid-cols-[120px_repeat(8,1fr)] lg:grid-cols-[160px_repeat(8,1fr)] min-w-[800px] md:min-w-0">
        
        <!-- Header Row -->
        <div class="sticky left-0 bg-slate-50 border-r border-b border-gray-200 z-20 py-2 px-3 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
          <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Lab & TALT</span>
        </div>
        <!-- Period Headers (1-8) generated by JS -->
        <div id="talt-grid-period-headers" class="contents"></div>

        <!-- Grid Body (Rows) generated by JS -->
        <div id="talt-grid-body" class="contents"></div>
        
      </div>
    </div>
  </div>

</div>

<script>
/**
 * TALT Controller Namespace
 * Isolates TALT view logic from the global scope.
 */
const taltView = {
  state: {
    isMaintenanceMode: false,
    labContextData: [],
    isLoading: true
  },

  /**
   * Initializes the TALT view, fetches data, and renders the Master Grid.
   */
  init: function() {
    this.renderShimmerGrid();
    
    // Fetch context data via the Bridge API[cite: 4]
    google.script.run
      .withSuccessHandler((response) => {
        if(response.status === 'success') {
          this.state.labContextData = response.payload;
          this.state.isLoading = false;
          this.renderGrid();
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } else {
          uiUtilities.showToast("Failed to load dashboard data", "error");
        }
      })
      .withFailureHandler((error) => {
        uiUtilities.showToast("Network Timeout", "error");
        this.state.isLoading = false;
      })
      .bridgeGetLabAssignmentContext();
  },

  /**
   * Toggles the Maintenance Mode state for placing Lab Outages[cite: 6].
   */
  toggleMaintenanceMode: function() {
    this.state.isMaintenanceMode = !this.state.isMaintenanceMode;
    const btn = document.getElementById('toggle-maintenance-btn');
    const knob = document.getElementById('maintenance-toggle-knob');
    
    if (this.state.isMaintenanceMode) {
      btn.classList.replace('bg-slate-300', 'bg-red-600');
      knob.classList.add('translate-x-6');
      uiUtilities.showToast("Maintenance Mode Active. Click slots to block.", "warning");
    } else {
      btn.classList.replace('bg-red-600', 'bg-slate-300');
      knob.classList.remove('translate-x-6');
    }
    this.renderGrid(); // Re-render to update hover/click states on cells
  },

  /**
   * Renders a skeleton loading state for the Master Grid.
   */
  renderShimmerGrid: function() {
    const headersContainer = document.getElementById('talt-grid-period-headers');
    const bodyContainer = document.getElementById('talt-grid-body');
    
    headersContainer.innerHTML = '';
    for (let p = 1; p <= 8; p++) {
      headersContainer.innerHTML += `<div class="bg-slate-50 border-b border-gray-200 py-2 text-center"><div class="h-4 w-16 bg-slate-200 animate-pulse mx-auto rounded"></div></div>`;
    }

    let bodyHTML = '';
    for (let l = 0; l < 5; l++) { // Mock 5 labs for shimmer
      bodyHTML += `
        <div class="sticky left-0 bg-white border-r border-b border-gray-200 z-10 p-2 flex flex-col gap-1">
          <div class="h-4 w-24 bg-slate-200 animate-pulse rounded"></div>
          <div class="h-3 w-16 bg-slate-100 animate-pulse rounded"></div>
        </div>
      `;
      for (let p = 1; p <= 8; p++) {
        bodyHTML += `<div class="border-b border-r border-gray-100 p-1"><div class="h-full w-full min-h-[44px] bg-slate-50 animate-pulse rounded-sm"></div></div>`;
      }
    }
    bodyContainer.innerHTML = bodyHTML;
  },

  /**
   * Constructs the live Master Grid utilizing horizontal overflow[cite: 6].
   */
  renderGrid: function() {
    const headersContainer = document.getElementById('talt-grid-period-headers');
    const bodyContainer = document.getElementById('talt-grid-body');
    
    // Build Headers
    headersContainer.innerHTML = '';
    for (let p = 1; p <= 8; p++) {
      headersContainer.innerHTML += `
        <div class="bg-slate-50 border-b border-gray-200 py-2 text-center flex flex-col items-center justify-center">
          <span class="text-xs font-bold text-gray-700">Period ${p}</span>
        </div>
      `;
    }

    // Build Body Rows
    let bodyHTML = '';
    
    // Safety check if no labs returned
    if (!this.state.labContextData || this.state.labContextData.length === 0) {
      bodyContainer.innerHTML = `<div class="col-span-9 p-8 text-center text-gray-500">No laboratory data available for current context.</div>`;
      return;
    }

    this.state.labContextData.forEach(lab => {
      // Lab Header Cell (Sticky Left)
      bodyHTML += `
        <div class="sticky left-0 bg-white border-r border-b border-gray-200 z-10 py-1 px-2 flex flex-col justify-center shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
          <span class="text-sm font-bold text-gray-800 truncate" title="${lab.labName}">${lab.labName}</span>
          <div class="flex items-center gap-1 mt-1 cursor-pointer hover:bg-slate-50 rounded p-1" onclick="taltView.openWorkloadModal('${lab.assignedTalt}')">
            <i data-lucide="user" class="w-3 h-3 text-muids-blue"></i>
            <span class="text-[10px] text-muids-blue truncate" title="${lab.assignedTalt}">${lab.assignedTalt || 'Unassigned'}</span>
            <i data-lucide="info" class="w-3 h-3 text-gray-400 ml-auto"></i>
          </div>
        </div>
      `;

      // 8 Periods Data Cells
      for (let p = 1; p <= 8; p++) {
        const slotId = `${uiUtilities.getActiveDate()}_${p}_${lab.labId}`; // $Date_Period_LabID$[cite: 6]
        const slotData = lab.periods.find(slot => slot.period === p);
        
        bodyHTML += this.generateCellHTML(slotId, slotData, lab);
      }
    });

    bodyContainer.innerHTML = bodyHTML;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  },

  /**
   * Generates individual cell DOM structure based on status constraints[cite: 6].
   */
  generateCellHTML: function(slotId, slotData, labInfo) {
    let cellClasses = "border-b border-r border-gray-200 p-1 min-h-[44px] h-12 relative group transition-colors duration-200 snap-center select-none ";
    let innerHTML = "";
    let clickHandler = "";

    // Maintenance Mode Override State
    if (this.state.isMaintenanceMode) {
      if (slotData && slotData.status === 'outage') {
        cellClasses += "bg-slate-700 bg-opacity-90 text-slate-100 diagonal-lines cursor-pointer hover:bg-red-700";
        innerHTML = `<div class="flex items-center justify-center h-full"><i data-lucide="trash-2" class="w-4 h-4"></i></div>`;
        clickHandler = `onclick="taltView.handleOutageClick('${slotId}', 'remove')"`;
      } else {
        cellClasses += "bg-white hover:border-2 hover:border-red-500 hover:bg-red-50/20 cursor-pointer";
        clickHandler = `onclick="taltView.handleOutageClick('${slotId}', 'add')"`;
      }
      return `<div class="${cellClasses}" ${clickHandler}>${innerHTML}</div>`;
    }

    // Standard Operational States
    if (!slotData) {
      cellClasses += "bg-white hover:bg-blue-50";
      return `<div class="${cellClasses}"></div>`;
    }

    switch(slotData.status) {
      case 'conflict':
        // Conflict State: bg-red-100 text-red-700 border-2 border-red-500 animate-pulse[cite: 6]
        cellClasses += "bg-red-100 text-red-700 border-2 border-red-500 animate-pulse cursor-pointer";
        innerHTML = `<div class="flex items-center justify-center h-full w-full font-bold text-xs"><i data-lucide="alert-octagon" class="w-4 h-4 mr-1"></i> Conflict</div>`;
        clickHandler = `onclick="taltView.openBatchWorkspace('${slotId}')"`;
        break;
      case 'pending':
        // Pending Request: bg-amber-50 text-amber-700[cite: 6]
        cellClasses += "bg-amber-50 text-amber-700 cursor-pointer hover:bg-amber-100";
        innerHTML = `<div class="flex flex-col items-center justify-center h-full w-full truncate"><span class="text-[10px] font-bold">${slotData.teacherName}</span><i data-lucide="clock" class="w-3 h-3 mt-1"></i></div>`;
        clickHandler = `onclick="taltView.openBatchWorkspace('${slotId}')"`;
        break;
      case 'booked':
        // Normal Booking: bg-emerald-50 text-emerald-700[cite: 6]
        cellClasses += "bg-emerald-50 text-emerald-700 cursor-pointer hover:bg-emerald-100";
        innerHTML = `<div class="flex flex-col items-center justify-center h-full w-full truncate"><span class="text-[10px] font-bold">${slotData.teacherName}</span><span class="text-[9px] opacity-75 truncate max-w-full px-1">${slotData.subject}</span></div>`;
        clickHandler = `onclick="taltView.openBatchWorkspace('${slotId}')"`;
        break;
      case 'outage':
        // Outage Block: bg-slate-700 text-white opacity-50 diagonal-lines[cite: 6]
        cellClasses += "bg-slate-700 text-white opacity-50 diagonal-lines cursor-not-allowed";
        innerHTML = `<div class="flex items-center justify-center h-full font-bold text-[10px] tracking-wider">CLOSED</div>`;
        break;
    }

    return `<div class="${cellClasses}" ${clickHandler} title="${slotData.teacherName || 'System'} - ${slotData.subject || 'N/A'}">${innerHTML}</div>`;
  },

  /**
   * Triggers the Batch Workspace modal to handle approvals or conflict resolutions[cite: 6].
   */
  openBatchWorkspace: function(slotId) {
    if (typeof openModalBatchAction === 'function') {
      openModalBatchAction(slotId);
    } else {
      console.warn("Batch Workspace module not loaded.");
      uiUtilities.showToast("Cannot open Batch Workspace", "error");
    }
  },

  /**
   * Handles outage placement and removal when in Maintenance Mode.
   */
  handleOutageClick: function(slotId, action) {
    if (action === 'add') {
      if (typeof openModalLabOutage === 'function') {
         openModalLabOutage(slotId);
      }
    } else if (action === 'remove') {
      // Trigger API to remove outage
      uiUtilities.showToast("Removing outage lock...", "warning");
      google.script.run
        .withSuccessHandler((res) => {
          if(res.status === 'success') {
            uiUtilities.showToast("Outage removed successfully", "success");
            this.init(); // Refresh grid
          } else {
            uiUtilities.showToast("Failed to remove outage", "error");
          }
        })
        .taltUpdateSystemConfig({ action: 'deleteOutage', slotId: slotId }); // Example route abstraction
    }
  },

  /**
   * Triggers the Workload Stats Modal for a specific technician[cite: 6].
   */
  openWorkloadModal: function(taltName) {
    if (!taltName || taltName === 'Unassigned') return;
    if (typeof openModalWorkload === 'function') {
      openModalWorkload(taltName);
    } else {
       uiUtilities.showToast("Workload Stats component not available.", "error");
    }
  }
};
</script>
